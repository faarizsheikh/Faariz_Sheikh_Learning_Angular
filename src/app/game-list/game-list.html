<div class="game-list">

  <button mat-mini-fab aria-label="Add a new game" matTooltip="Add a new game." matTooltipClass="custom-tooltip"
    matTooltipPosition="above" (click)="addNewGame()" class="add-btn">
    <mat-icon>add</mat-icon>
  </button>

  <div class="filters">
    <!-- Sort Field -->
    <mat-form-field appearance="fill">
      <mat-label>Sort by</mat-label>
      <mat-select [(value)]="sortField" (selectionChange)="applySorting()">
        <mat-option value="none">None (Default)</mat-option>
        <mat-option value="developer">Developer</mat-option>
        <mat-option value="title">Title</mat-option>
        <mat-option value="yearReleased">Year</mat-option>

      </mat-select>
    </mat-form-field>

    <!-- Sort Order Dropdown -->
    <mat-form-field appearance="fill">
      <mat-label>Order</mat-label>
      <mat-select [(value)]="sortOrder" (selectionChange)="applySorting()" [disabled]="sortField === 'none'">
        <mat-option value="asc">Ascending</mat-option>
        <mat-option value="desc">Descending</mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Arrow Icon -->
    <button mat-icon-button (click)="toggleSortOrder()" [disabled]="sortField === 'none'"
      [matTooltip]="sortField === 'none' ? '' : (sortOrder === 'asc' ? 'Ascending' : 'Descending')"
      matTooltipClass="custom-tooltip" matTooltipPosition="right">
      <mat-icon>
        {{ sortOrder === 'asc' ? 'arrow_upward' : 'arrow_downward' }}
      </mat-icon>
    </button>
  </div>

  <!-- Show loading animation -->
  @if (loading) {
  <div class="loading-screen">
    <p>🎮 Loading games...</p>
    <div class="spinner"></div>
  </div>
  } @else {
  <!-- Error message -->
  @if (errorMessage) {
  <div class="error">{{ errorMessage }}</div>
  }

  <!-- Show games list -->
  @if (games.length > 0) {
  @for (game of filteredGames; track game.id; let i = $index) {
  <div class="game-entry">
    <app-game-list-item [game]="game" [isEven]="i % 2 === 0">
    </app-game-list-item> <!-- Gets the list of games from the game-list-item component-->

    <div class="game-actions">
      <button mat-mini-fab aria-label="Edit game" matTooltip="Edit the game {{game.title}}."
        matTooltipClass="custom-tooltip" matTooltipPosition="above" (click)="editGame(game)" class="edit-btn">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-mini-fab aria-label="Delete game"
        matTooltip="Delete the {{game.title}} game? (WARNING: This action cannot be undone.)"
        matTooltipClass="custom-tooltip" matTooltipPosition="below" (click)="deleteGame(game)" class="delete-btn">
        <mat-icon>delete</mat-icon>
      </button>
      <button mat-mini-fab aria-label="View game" matTooltip="View details of {{game.title}}."
        matTooltipClass="custom-tooltip" matTooltipPosition="above" [routerLink]="['/games', game.id]"
        routerLinkActive="active" class="view-btn">
        <mat-icon>remove_red_eye</mat-icon>
      </button>
    </div>
  </div>
  }
  } @else {
  <p class="no-games">No games found.</p>
  }
  }
</div>
