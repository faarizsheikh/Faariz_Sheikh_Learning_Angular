<form [formGroup]="gameForm" (ngSubmit)="submitForm()">
  <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>

  <div>
    <label for="title">Title:</label>
    <input id="title" formControlName="title"
           placeholder="Title" (input)="gameForm.get('title')?.updateValueAndValidity()"/>
  </div>

  <div>
    <label for="developer">Developer:</label>
    <input id="developer" formControlName="developer" placeholder="Developer" />
  </div>

  <div>
    <label for="genre">Genre:</label>
    <input id="genre" formControlName="genre" placeholder="Genre" />
  </div>

  <div>
    <label for="yearReleased">Year of Release:</label>
    <input id="yearReleased" formControlName="yearReleased" type="number"
           placeholder="Year Released" min = "1950" max = {{Date}} />
  </div>

  <div>
    <label for="platform">Platform:</label>
    <input id="platform" formControlName="platform" placeholder="Platform" />
  </div>

  <div>
    <label for="platform">Price:</label>
    <input id="platform" formControlName="price" placeholder="Price" />
  </div>

  <div>
    <label for="imageUrl">Image URL:</label>
    <input id="imageUrl" formControlName="imageUrl" placeholder="Image URL" />
  </div>

  <div class="notes">
    <label for="notes">Notes (optional):</label>
    <textarea id="notes" maxlength="300" formControlName="notes" placeholder="Notes"></textarea>
  </div>

  <div class="completed">
    <label for="isCompleted">Completed:</label>
    <input id="isCompleted" type="checkbox" formControlName="isCompleted" />
  </div>

  <button type="submit">{{ isEditMode ? 'Update' : 'Add' }}</button>
</form>
