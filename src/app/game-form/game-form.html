<h2 type="submit">{{ isEditMode ? 'Update an existing game' : 'Add a new game' }}</h2>

<div class="err-box">
  @if (errorMessage) {
    <div class="error-box">{{ errorMessage }}</div>
  }
</div>

<form [formGroup]="gameForm" (ngSubmit)="submitForm()">
  <!-- Title -->
  <div>
    <label for="title">Title:</label>
    <input id="title" formControlName="title" placeholder="Call of Duty: Black Ops" />
  </div>

  <!-- Sequential Order -->
  <div>
    <label for="sequentialNumbering">Sequential Order:</label>
    <input
      id="sequentialNumbering"
      formControlName="sequentialNumbering"
      type="number" placeholder="1"
      [min] = "0"
      [max] = "1000" />
  </div>

  <!-- Developer -->
  <div>
    <label for="developer">Developer:</label>
    <input id="developer" formControlName="developer" placeholder="Activision" />
  </div>

  <!-- Genre -->
  <div>
    <label for="genre">Genre:</label>
    <input id="genre" formControlName="genre" placeholder="Action, FPS, Multiplayer..." />
  </div>

  <!-- Year Released -->
  <div>
    <label for="yearReleased">Year of Release:</label>
    <input
      id="yearReleased"
      formControlName="yearReleased"
      type="number"
      placeholder="2010"
      min="1950"
      [max]="Date"
    />
  </div>

  <!-- Platform -->
  <div>
    <label for="platform">Platform:</label>
    <input id="platform" formControlName="platform" placeholder="Mobile, PC, PlayStation, XBox..." />
  </div>

  <!-- Price -->
  <div>
    <label for="price">Price:</label>
    <input id="price" formControlName="price" type="number" placeholder="$39.99" [min] = "0" />
  </div>

  <!-- Image URL -->
  <div>
    <label for="imageUrl">Image URL:</label>
    <input
      id="imageUrl"
      formControlName="imageUrl"
      placeholder="https://www.google.com/images/cod-bo1-banner.jpeg"
    />
  </div>

  <!-- Notes -->
  <div class="notes">
    <label for="notes">Notes (optional):</label>
    <textarea
      id="notes"
      maxlength="300"
      formControlName="notes"
      placeholder="Fun, multiplayer game with various modes and weapons."
    ></textarea>
  </div>

  <!-- Completed -->
  <div class="completed">
    <label for="isCompleted">Completed:</label>
    <input id="isCompleted" type="checkbox" formControlName="isCompleted" />
  </div>

  <!-- Submit -->
  <button type="submit">{{ isEditMode ? 'Update' : 'Add' }}</button>
</form>
