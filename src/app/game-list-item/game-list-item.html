<div *ngIf="game" class="game-list-item" [ngClass]="isEven ? 'even' : 'odd'">
  <img
    [src]="game.imageUrl"
    [alt]="
    (game.title.trim() | titlecase) + ' by ' + game.developer.trim().split(',')[0] | titlecase"
    [title]="(game.title.trim() | titlecase) + ' by ' + game.developer.trim().split(',')[0] | titlecase"
    class="game-image"
  />

  <h2>{{ game.title.trim() | titlecase }}</h2>
</div>
