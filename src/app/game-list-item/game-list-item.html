@if (game) {
  <div class="game-list-item" [ngClass]="isEven ? 'even' : 'odd'">
    <img
      [src]="game.imageUrl"

      [alt]="
        (game.title.trim() | Normalizespaces | Titlecase) +
        ' by ' +
        (game.developer.trim().split(',')[0] | Normalizespaces | titlecase)
      "

      [title]="
        (game.title.trim() | Normalizespaces | Titlecase) +
        ' by ' +
        (game.developer.trim().split(',')[0] | Normalizespaces | titlecase)
      "
      class="game-image"
    />

    <h2>{{ game | GamenameYear | Normalizespaces | Titlecase }}</h2>
  </div>
}
