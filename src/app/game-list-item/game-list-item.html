@if (game) {

<mat-card class="game-list-item" [appEvenOddHighlight]="isEven">

  <img mat-card-image [src]="game.imageUrl" [alt]="
        (game.title.trim() | Normalizespaces | Titlecase) +
        ' by ' +
        (game.developer.trim().split(',')[0] | Normalizespaces | titlecase)
      " [title]="
        (game.title.trim() | Normalizespaces | Titlecase) +
        ' by ' +
        (game.developer.trim().split(',')[0] | Normalizespaces | titlecase)
      " />

  <mat-card-header>
    <mat-card-title>
      <h2>{{ game | GamenameYear | Normalizespaces | Titlecase }}</h2>
    </mat-card-title>
    <mat-card-subtitle>
      <h3>{{ game.developer.trim().split(',')[0] | Normalizespaces | Titlecase }}</h3>
    </mat-card-subtitle>
  </mat-card-header>
</mat-card>
}
