<h2>Modify Game List</h2>

<button (click)="addNewGame()">Add New Game</button>

<div *ngFor="let game of games" class="game-item">
  <h3>{{ game.title }}</h3>
  <p>
    <span class="label-name">Status: </span>
    <span [ngClass]="game.isCompleted ? 'status-completed' : 'status-incomplete'">
      {{ game.isCompleted ? 'Completed' : 'Incomplete' }}
    </span>
  </p>

  <button (click)="editGame(game)">Edit</button>
  <button (click)="deleteGame(game)">Delete</button>
  <button (click)="toggleStatus(game)">Toggle Status</button>
</div>
