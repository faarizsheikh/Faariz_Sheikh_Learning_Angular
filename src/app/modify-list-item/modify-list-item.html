<div>
  <h2>Modify Game List</h2>
  <button mat-mini-fab aria-label="Add game" matTooltip="Add a new game." matTooltipClass="custom-tooltip"
    matTooltipPosition="above" (click)="addNewGame()" class="add-btn" [appHoverHighlight]="'#00e676'">
    <mat-icon>add</mat-icon>
  </button>

  <p>You can also edit or delete games from the main game list.</p>
  <button mat-mini-fab aria-label="Return home." matTooltip="Return home." matTooltipClass="custom-tooltip"
    matTooltipPosition="below" routerLink="/" routerLinkActive="active" class="return-icon"
    [appHoverHighlight]="'#00e676'">
    <mat-icon>reply</mat-icon>
  </button>
</div>
