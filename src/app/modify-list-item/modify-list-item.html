<h2>Modify Game List</h2>
<div
  *ngFor="let game of games;
  let i = index" class="game-item"
  [ngClass]="i % 2 === 0 ? 'even' : 'odd'"
>
  <h3>{{ game.title }}</h3>
  <p>Status: {{ game.isCompleted ? 'Completed' : 'Incomplete' }}</p>
  <button (click)="toggleStatus(game)" class="toggle-button">Toggle Status</button>
</div>
