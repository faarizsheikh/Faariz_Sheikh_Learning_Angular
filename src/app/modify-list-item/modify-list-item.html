<h2>Modify Game List</h2>
<div
  *ngFor="let game of games;
  let i = index" class="game-item">
  <h3>{{ game.title }}</h3>
  <p>
    <span class="label-name">Status: </span>
    <span [ngClass]="game.isCompleted ? 'status-completed' : 'status-incomplete'">
      {{ game.isCompleted ? 'Completed' : 'Incomplete' }}
    </span>
  </p>
  <button (click)="toggleStatus(game)" class="toggle-button">Toggle Status</button>
</div>
